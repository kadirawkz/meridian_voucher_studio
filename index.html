<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Voucher Studio</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem("meridian-theme");
          const systemIsDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || ((!theme || theme === "system") && systemIsDark);
          document.documentElement.style.backgroundColor = isDark ? "#090d16" : "#f6f8fb";
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
